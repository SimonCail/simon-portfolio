name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci plutot que npm install : installe exactement le package-lock,
      # donc la CI echoue si le lock et le package.json divergent.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # next build ne verifie que les fichiers qu'il compile ; tsc --noEmit
      # passe sur tout le projet, y compris ce qui n'est pas encore importe.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # On construit sans publier : le but est de garantir que le Dockerfile
      # reste valide, pas de livrer une image.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: simon-portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Un build qui passe ne prouve pas que le serveur demarre. On lance le
      # conteneur et on attend une vraie reponse HTTP.
      - name: Smoke test
        run: |
          docker run -d --name portfolio -p 3000:3000 simon-portfolio:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 > /dev/null; then
              echo "Le serveur repond."
              exit 0
            fi
            sleep 2
          done
          echo "Pas de reponse apres 60s :"
          docker logs portfolio
          exit 1
